name: Java CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:

jobs:
  build-test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test, metrics, SpotBugs and PMD
        run: mvn -B clean verify

      - name: Headless smoke test
        run: java -jar target/massey-text-editor.jar --smoke-test

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/
            target/surefire-reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t massey-text-editor .
      - name: Docker smoke test
        run: docker run --rm massey-text-editor --smoke-test
